# Nested Structure Example
# Demonstrates C2 (container) and C3 (component) levels using dotted notation

[properties]
name = "Nested Architecture"
description = "System with containers and components"

[user]
type = "person"
name = "Customer"
link = { "shop.webapp" = { technology = "HTTPS", description = "Browses and orders" } }

# C1 Level: Main System
[shop]
type = "system"
name = "E-Commerce Platform"
description = "Online shopping platform"

# C2 Level: Containers
[shop.webapp]
type = "container"
name = "Web Application"
description = "Customer-facing frontend"
technology = "React, TypeScript"

# C2 Level: API System with C3 components
[shop.api]
type = "system"
name = "API Service"
description = "Backend API"
technology = "Node.js, Express"

[shop.api.handlers]
type = "component"
name = "HTTP Handlers"
description = "Request routing and validation"
technology = "Express Router"
link = { "shop.webapp" = { technology = "REST/JSON", description = "Serves" } }

[shop.api.services]
type = "component"
name = "Business Services"
description = "Domain logic and orchestration"
technology = "TypeScript"
link = { "shop.api.handlers" = { description = "Called by" } }

[shop.api.repository]
type = "component"
name = "Data Repository"
description = "Database access layer"
technology = "Prisma ORM"
link = { "shop.api.services" = { description = "Used by" } }
linkFrom = { "shop.database" = { description = "Connects to" } }

[shop.database]
type = "containerDb"
name = "Database"
description = "Persistent storage"
technology = "PostgreSQL"
link = { "shop.api.repository" = { technology = "SQL", description = "Queries" } }
