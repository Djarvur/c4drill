# E-Commerce Architecture Example
# Realistic full architecture demonstrating real-world usage

[properties]
name = "E-Commerce Platform"
description = "Complete online shopping platform"
edges = "spline"
expanded = ["inventory"]

# ===== ACTORS =====

[customer]
type = "person"
name = "Customer"
description = "Online shopper"

[[customer.link]]
peer = "webapp"
technology = "HTTPS"
description = "Browses and orders"

[admin]
type = "person"
name = "Admin"
description = "System administrator"
color = "#FFF9C4"
border = "#F9A825"

[[admin.link]]
peer = "admin-panel"
technology = "HTTPS"
description = "Manages system"

[support]
type = "person"
name = "Support Agent"
description = "Customer support"
color = "#FFF9C4"
border = "#F9A825"

[[support.link]]
peer = "support-tool"
technology = "HTTPS"
description = "Handles tickets"

# ===== EXTERNAL SERVICES =====

[stripe]
type = "systemExternal"
name = "Stripe"
description = "Payment processor"
technology = "Stripe API"
color = "#E3F2FD"
border = "#1976D2"

[[stripe.link]]
peer = "payment-service"
description = "Webhooks"

[sendgrid]
type = "systemExternal"
name = "SendGrid"
description = "Email service"
technology = "SendGrid API"
color = "#E3F2FD"
border = "#1976D2"

[[sendgrid.link]]
peer = "notification-service"
description = "Delivery status"

[segment]
type = "systemExternal"
name = "Segment"
description = "Analytics platform"
technology = "Segment API"
color = "#E3F2FD"
border = "#1976D2"

[[segment.link]]
peer = "event-bus"
description = "Analytics pipeline"

# ===== MAIN SYSTEM =====

[webapp]
type = "system"
name = "Web Application"
description = "Customer-facing frontend"
technology = "Next.js, React"
color = "#E8F5E9"
border = "#388E3C"

[[webapp.linkFrom]]
peer = "customer"
description = "Browses and orders"

[[webapp.link]]
peer = "api-gateway"
technology = "REST/JSON"
description = "Calls"

[api-gateway]
type = "system"
name = "API Gateway"
description = "API routing and rate limiting"
technology = "Kong, Node.js"
color = "#E8F5E9"
border = "#388E3C"

[[api-gateway.linkFrom]]
peer = "webapp"
technology = "REST/JSON"
description = "Serves"

[[api-gateway.linkFrom]]
peer = "admin-panel"
technology = "REST/JSON"
description = "Admin API calls"

[[api-gateway.linkFrom]]
peer = "support-tool"
technology = "REST/JSON"
description = "Support API"

# ===== MICROSERVICES =====

[user-service]
type = "container"
name = "User Service"
description = "User management and authentication"
technology = "Go, gRPC"

[[user-service.link]]
peer = "api-gateway"
technology = "gRPC"
description = "Authenticates"

[order-service]
type = "container"
name = "Order Service"
description = "Order processing and management"
technology = "Go, gRPC"

[[order-service.link]]
peer = "api-gateway"
technology = "gRPC"
description = "Handles orders"

[[order-service.linkFrom]]
peer = "payment-service"
technology = "gRPC"
description = "Payment confirmation"

[[order-service.linkFrom]]
peer = "inventory-service"
technology = "gRPC"
description = "Stock check"

[inventory-service]
type = "container"
name = "Inventory Service"
description = "Product catalog and stock management"
technology = "Go, gRPC"

[[inventory-service.link]]
peer = "api-gateway"
technology = "gRPC"
description = "Product queries"

[[inventory-service.linkFrom]]
peer = "order-service"
technology = "gRPC"
description = "Stock check"

[payment-service]
type = "container"
name = "Payment Service"
description = "Payment processing"
technology = "Go, gRPC"
color = "#FFEBEE"
border = "#C62828"

[[payment-service.link]]
peer = "order-service"
technology = "gRPC"
description = "Processes payments"

[[payment-service.link]]
peer = "stripe"
technology = "Stripe API"
description = "Processes payments"
color = "#1976D2"
style = "dashed"

[[payment-service.linkFrom]]
peer = "stripe"
technology = "Webhook"
description = "Payment events"
color = "#1976D2"

[notification-service]
type = "container"
name = "Notification Service"
description = "Email and push notifications"
technology = "Node.js, Redis"

[[notification-service.link]]
peer = "sendgrid"
technology = "SendGrid API"
description = "Sends emails"
color = "#1976D2"
style = "dashed"

[[notification-service.linkFrom]]
peer = "order-service"
technology = "Kafka"
description = "Order events"

[[notification-service.linkFrom]]
peer = "sendgrid"
technology = "Webhook"
description = "Delivery status"
color = "#1976D2"

# ===== DATABASES =====

[user-db]
type = "containerDb"
name = "User Database"
description = "User profiles and sessions"
technology = "PostgreSQL"

[[user-db.link]]
peer = "user-service"
technology = "SQL"
description = "Queries"
color = "#4CAF50"

[order-db]
type = "containerDb"
name = "Order Database"
description = "Orders and transactions"
technology = "PostgreSQL"

[[order-db.link]]
peer = "order-service"
technology = "SQL"
description = "Queries"
color = "#4CAF50"

[inventory-db]
type = "containerDb"
name = "Inventory Database"
description = "Products and stock levels"
technology = "PostgreSQL"

[[inventory-db.link]]
peer = "inventory-service"
technology = "SQL"
description = "Queries"
color = "#4CAF50"

# ===== QUEUES =====

[event-bus]
type = "containerQueue"
name = "Event Bus"
description = "Async event processing"
technology = "Kafka"
color = "#FCE4EC"
border = "#C2185B"

[[event-bus.linkFrom]]
peer = "order-service"
technology = "Kafka Protocol"
description = "Publishes events"
color = "#C2185B"

[[event-bus.link]]
peer = "notification-service"
technology = "Kafka Protocol"
description = "Consumes events"
color = "#C2185B"

[[event-bus.link]]
peer = "segment"
technology = "Kafka Connect"
description = "Analytics pipeline"
color = "#C2185B"
style = "dashed"

# ===== CACHING =====

[cache]
type = "containerDb"
name = "Cache Layer"
description = "Session and data caching"
technology = "Redis"
color = "#FFF3E0"
border = "#E65100"

[[cache.linkFrom]]
peer = "user-service"
technology = "Redis Protocol"
description = "Session cache"
color = "#E65100"

[[cache.linkFrom]]
peer = "inventory-service"
technology = "Redis Protocol"
description = "Product cache"
color = "#E65100"

# ===== ADMIN TOOLS =====

[admin-panel]
type = "system"
name = "Admin Panel"
description = "Internal admin interface"
technology = "React, TypeScript"
color = "#F3E5F5"
border = "#7B1FA2"

[[admin-panel.link]]
peer = "api-gateway"
technology = "REST/JSON"
description = "Admin API"

[support-tool]
type = "system"
name = "Support Tool"
description = "Customer support interface"
technology = "React, TypeScript"
color = "#F3E5F5"
border = "#7B1FA2"

[[support-tool.link]]
peer = "api-gateway"
technology = "REST/JSON"
description = "Support API"
