# E-Commerce Architecture Example
# Realistic full architecture demonstrating real-world usage

[properties]
name = "E-Commerce Platform"
description = "Complete online shopping platform"
edges = "spline"
expanded = ["inventory"]

# ===== ACTORS =====

[customer]
type = "person"
name = "Customer"
description = "Online shopper"
link = { "webapp" = { technology = "HTTPS", description = "Browses and orders" } }

[admin]
type = "person"
name = "Admin"
description = "System administrator"
color = "#FFF9C4"
border = "#F9A825"
link = { "admin-panel" = { technology = "HTTPS", description = "Manages system" } }

[support]
type = "person"
name = "Support Agent"
description = "Customer support"
color = "#FFF9C4"
border = "#F9A825"
link = { "support-tool" = { technology = "HTTPS", description = "Handles tickets" } }

# ===== EXTERNAL SERVICES =====

[stripe]
type = "systemExternal"
name = "Stripe"
description = "Payment processor"
technology = "Stripe API"
color = "#E3F2FD"
border = "#1976D2"

[sendgrid]
type = "systemExternal"
name = "SendGrid"
description = "Email service"
technology = "SendGrid API"
color = "#E3F2FD"
border = "#1976D2"

[segment]
type = "systemExternal"
name = "Segment"
description = "Analytics platform"
technology = "Segment API"
color = "#E3F2FD"
border = "#1976D2"

# ===== MAIN SYSTEM =====

[webapp]
type = "system"
name = "Web Application"
description = "Customer-facing frontend"
technology = "Next.js, React"
color = "#E8F5E9"
border = "#388E3C"

[api-gateway]
type = "system"
name = "API Gateway"
description = "API routing and rate limiting"
technology = "Kong, Node.js"
color = "#E8F5E9"
border = "#388E3C"
link = { "webapp" = { technology = "REST/JSON", description = "Serves" } }

[api-gateway.linkFrom."admin-panel"]
technology = "REST/JSON"
description = "Admin API calls"

[api-gateway.linkFrom."support-tool"]
technology = "REST/JSON"
description = "Support API"

# ===== MICROSERVICES =====

[user-service]
type = "container"
name = "User Service"
description = "User management and authentication"
technology = "Go, gRPC"
link = { "api-gateway" = { technology = "gRPC", description = "Authenticates" } }

[order-service]
type = "container"
name = "Order Service"
description = "Order processing and management"
technology = "Go, gRPC"
link = { "api-gateway" = { technology = "gRPC", description = "Handles orders" } }

[order-service.linkFrom."payment-service"]
technology = "gRPC"
description = "Payment confirmation"

[order-service.linkFrom."inventory-service"]
technology = "gRPC"
description = "Stock check"

[inventory-service]
type = "container"
name = "Inventory Service"
description = "Product catalog and stock management"
technology = "Go, gRPC"
link = { "api-gateway" = { technology = "gRPC", description = "Product queries" } }
linkFrom = { "order-service" = { technology = "gRPC", description = "Stock check" } }

[payment-service]
type = "container"
name = "Payment Service"
description = "Payment processing"
technology = "Go, gRPC"
color = "#FFEBEE"
border = "#C62828"

[payment-service.link."order-service"]
technology = "gRPC"
description = "Processes payments"

[payment-service.link.stripe]
technology = "Stripe API"
description = "Processes payments"
color = "#1976D2"
style = "dashed"

[payment-service.linkFrom.stripe]
technology = "Webhook"
description = "Payment events"
color = "#1976D2"

[notification-service]
type = "container"
name = "Notification Service"
description = "Email and push notifications"
technology = "Node.js, Redis"
link = { "sendgrid" = { technology = "SendGrid API", description = "Sends emails", color = "#1976D2", style = "dashed" } }

[notification-service.linkFrom."order-service"]
technology = "Kafka"
description = "Order events"

[notification-service.linkFrom.sendgrid]
technology = "Webhook"
description = "Delivery status"
color = "#1976D2"

# ===== DATABASES =====

[user-db]
type = "containerDb"
name = "User Database"
description = "User profiles and sessions"
technology = "PostgreSQL"
link = { "user-service" = { technology = "SQL", description = "Queries", color = "#4CAF50" } }

[order-db]
type = "containerDb"
name = "Order Database"
description = "Orders and transactions"
technology = "PostgreSQL"
link = { "order-service" = { technology = "SQL", description = "Queries", color = "#4CAF50" } }

[inventory-db]
type = "containerDb"
name = "Inventory Database"
description = "Products and stock levels"
technology = "PostgreSQL"
link = { "inventory-service" = { technology = "SQL", description = "Queries", color = "#4CAF50" } }

# ===== QUEUES =====

[event-bus]
type = "containerQueue"
name = "Event Bus"
description = "Async event processing"
technology = "Kafka"
color = "#FCE4EC"
border = "#C2185B"
linkFrom = { "order-service" = { technology = "Kafka Protocol", description = "Publishes events", color = "#C2185B" } }

[event-bus.link."notification-service"]
technology = "Kafka Protocol"
description = "Consumes events"
color = "#C2185B"

[event-bus.link.segment]
technology = "Kafka Connect"
description = "Analytics pipeline"
color = "#C2185B"
style = "dashed"

# ===== CACHING =====

[cache]
type = "containerDb"
name = "Cache Layer"
description = "Session and data caching"
technology = "Redis"
color = "#FFF3E0"
border = "#E65100"

[cache.linkFrom."user-service"]
technology = "Redis Protocol"
description = "Session cache"
color = "#E65100"

[cache.linkFrom."inventory-service"]
technology = "Redis Protocol"
description = "Product cache"
color = "#E65100"

# ===== ADMIN TOOLS =====

[admin-panel]
type = "system"
name = "Admin Panel"
description = "Internal admin interface"
technology = "React, TypeScript"
color = "#F3E5F5"
border = "#7B1FA2"

[support-tool]
type = "system"
name = "Support Tool"
description = "Customer support interface"
technology = "React, TypeScript"
color = "#F3E5F5"
border = "#7B1FA2"
