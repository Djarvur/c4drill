<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Box body -->
  <!-- Front face -->
  <path d="M 20 45 L 20 85 L 65 85 L 65 45"
        fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>

  <!-- Right side face -->
  <path d="M 65 45 L 85 30 L 85 70 L 65 85"
        fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>

  <!-- Lid (top face) -->
  <!-- Added Z flag at end to close the path and draw the front top edge -->
  <path d="M 20 45 L 40 30 L 85 30 L 65 45 Z"
        fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>

  <!-- Handle slot (on front face) -->
  <path d="M 35 55 L 50 55 L 50 62 L 35 62 Z"
        fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
</svg>
