<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Central square (chip core) -->
  <rect x="30" y="30" width="40" height="40"
        fill="none" stroke="currentColor" stroke-width="4"/>

  <!-- Contacts top and bottom -->
  <line x1="40" y1="30" x2="40" y2="15" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="50" y2="15" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="30" x2="60" y2="15" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>

  <line x1="40" y1="70" x2="40" y2="85" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="50" y2="85" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="70" x2="60" y2="85" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>

  <!-- Contacts left and right -->
  <line x1="30" y1="40" x2="15" y2="40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="15" y2="50" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="60" x2="15" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>

  <line x1="70" y1="40" x2="85" y2="40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="85" y2="50" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="60" x2="85" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</svg>
