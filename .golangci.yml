# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: '2'

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

# Enable all linters
linters:
  default: all
  disable:
    - wsl # deprecated, replaced by wsl_v5
    - exhaustruct # too noisy for partial struct initialization
    - depguard # project-internal imports trigger false positives
    - noinlineerr # inline error checks are fine
    - ireturn # returning interfaces is acceptable
    - varnamelen # short variable names are idiomatic in Go
    - tagliatelle # JSON tags follow external API conventions
    - dupl # duplicate detection too noisy for test code
    - cyclop # cyclomatic complexity covered by other linters
    - goconst # repeated strings in test fixtures are intentional
    - lll # line length is not enforced
    - gocognit # cognitive complexity metric, not actionable here
    - funlen # test functions are long by design
    - nlreturn # blank-line-before-return style, not enforced
    - mnd # magic numbers are self-evident in context
    - modernize # Go modernization suggestions, tracked separately
    - testifylint # assertion style in tests, not enforced
    - testpackage # black-box test packages not required
    - revive # umbrella style linter; specific rules not adopted
    - nolintlint # nolint usage style, not enforced
    - gosmopolitan # non-ASCII string literals (e.g. CJK wrap tests) are intentional
    - godoclint # doc comment style, not enforced
    - gocritic # stylistic suggestions, not adopted
    - godot # period-at-end-of-comment style, not enforced
    - maintidx # maintainability index, not actionable
    - nestif # nested-if complexity covered by gocognit
  settings:
    gomoddirectives:
      replace-allow-list:
        - github.com/goccy/go-graphviz
  exclusions:
    rules:
      # Exclude errcheck for deferred Close() calls
      - linters:
          - errcheck
        text: 'Error return value of `.*Close` is not checked'
