# Fixture for TMPL-04: a template declaring a subunit subtree. One [[use]]
# produces the whole subtree rooted at the produced unit, subunit keys verbatim
# (D-04 — no structural parametrization), fields substituted.
# svc=system (C1), api=container (C2 under system), db=containerDb (C2 under system).
[properties]
name = "Subtree Template Test"

[template.svc]
params = ["name", "tech"]
name = "${name} Service"
type = "system"
technology = "${tech}"

[template.svc.api]
type = "container"
name = "${name} API"
technology = "${tech}"

[template.svc.db]
type = "containerDb"
name = "${name} DB"
technology = "PostgreSQL"

[[use]]
template = "svc"
name = "auth"
tech = "Go"

[messageBus]
type = "queue"
name = "Message Bus"
