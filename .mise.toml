# Mise configuration for c4drill
# https://mise.jdx.dev

[tools]
go = "1.26"
golangci-lint = "2"

[tasks.test]
description = "Run Go tests with coverage"
run = "go test -cover ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.lint-fix]
description = "Run golangci-lint with auto-fix"
run = "golangci-lint run --fix ./..."
