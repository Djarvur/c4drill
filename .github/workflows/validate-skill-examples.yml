name: Validate Examples

on:
  push:
    branches:
      - master
    paths:
      - 'skill/**'
      - 'examples/**'
  pull_request:
    paths:
      - 'skill/**'
      - 'examples/**'

concurrency:
  group: validate-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build c4drill
        run: go build -o c4drill ./cmd/c4drill

      - name: Validate skill examples
        run: |
          for file in skill/examples/*.toml; do
            echo "Validating $file..."
            ./c4drill "$file" -f dot > /dev/null
          done

      - name: Validate ported likec4 examples
        run: |
          for file in examples/*/*.toml; do
            echo "Validating $file..."
            ./c4drill "$file" -f dot > /dev/null
          done
